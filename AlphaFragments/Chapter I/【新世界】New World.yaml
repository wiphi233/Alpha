    序章

    天空中的云朵是金色的，它们似乎被风被拉的细长无比，像丝带，像琴弦，诉说着这儿过去的一切。

    它们就这样静静地飘着，无拘无束。

    昏黄的夕阳照着略显苍凉的草原，只有风带来了若有若无的风琴声。

    几根残缺的白色大理石柱围绕着破损的祭坛，任由青翠的藤蔓攀爬，缠绕。
    
    在这祭坛中间，青翠的藤蔓织成了床，托着一个身穿白衣的少女。

    她是那么轻盈，就像一片羽毛，落在了这里。

    她躺在祭坛中间，灰白的长发柔顺地散开，眼静闭着，呼吸均匀而安静。

    不远处，一个身影拖着被夕阳拉长的影子，踱着方步走了过来。

    那是一个须发皆白的老者，穿着拖沓的黑色巫师袍，左眼的单片眼镜下是一颗浑浊、苍老的眼眸，而右眼的眼睛里却闪动着一颗墨绿的瞳孔。

    他佝偻着，拄着一根漆黑而笔直的拐杖，来到了少女身旁。

    他轻轻伸出了苍老的手，手上布满了岁月留下的痕迹。

    当树皮般的皮肤触及到少女的额头时，少女的呼吸变得紧张起来，均匀的节奏被打乱，少女的眉微蹙。

    不知何时，那身穿巫师袍的老者已经不见了，只留下呼吸越发急乱的少女。

    第一章：风琴

    “我···这是在哪里？“

    一位白衣少女躺在祭坛的白石圆台上，感觉一阵窒息感压上心头。

    仿佛坠入深水中，呼吸都尤为困难，四肢沉重得像灌了铅。

    她不断地挣扎，忽然，一口气猛地灌入她的嘴中，零睁开了眼，猛然坐起。

    在藤蔓覆盖的祭坛上喘着粗气，环顾四周。

    破损的米白色大理石柱被藤蔓缠绕着，任由影子被夕阳拖得很长很长。

    白衣少女大口的呼吸着，脑中一片混乱。

    “大抵是失忆了。“
    
    她大脑空白，记忆如同被水洗过的墨迹，模糊不清，一切的一切，都被吞噬殆尽。
    
    自己叫什么，自己的年龄，这是哪儿，自己又为什么会出现在这儿，什么也即不得了，不过她并不想深究。

    夕阳越垂越低，它将周围的云彩晕染成红色，天空中的星星也愈发明亮。
    
    她也渐渐恢复了均匀的呼吸，一阵不安感涌上心头。

    天，要黑了。

    一轮澄澈的圆月高悬天际，清辉如水，将山林间的雾气都染成了银白色。她漫无目的地走着，要是找不到有人烟的地方，就只能在这儿露宿了。
    
    她远远望见半山腰处立着一栋木屋，借着淡淡的月光，拨开荒草，涉过溪流，穿过密林，周遭的光线愈发晦暗，空气里透着一股不祥的沉寂。不知是错觉还是某种预兆，她隐隐觉得，明天会有好事发生。

    这是一座吊脚楼（苗族传统建筑），突兀得像被一只无形的手刻意搁置于此，与周围的山水草木格格不入——它本就不该出现在这里。

    她爬上吱呀作响的木梯，发现门是从外扣着的，趁着夕阳还未完全落下，推开门，进了屋。

    客厅里，火塘里的灰是冷的，显然，很多天没人住过了。墙角的大竹桶里装满了清澈的水，她尝了一口，走累了，决定在这儿过夜。

    她发现底层有些许干柴，厨房竹筒里有米，便开始烧火做饭。她在温暖的火塘旁，吃饱喝足，泡着脚，躺在干草铺上。

    但，疑问还是不可避免地来临了：“我为什么会出现在这儿，我甚至都不知道这儿有没有人类。”
