    序章：终？始
  
    天空中的云朵是金色的，它们似乎被风被拉的细长无比，像丝带，像琴弦 

    它们就这样静静地飘着，无拘无束

    昏黄的夕阳照着略显苍凉的草原，只有风带来了若有若无的风琴声 

    几根残缺的白色大理石柱围绕着破损的祭坛，任由青翠的藤蔓攀爬，缠绕
    
    在这祭坛中间，青翠的藤蔓织成了床，托着一个身穿白衣的少女

    她是那么轻盈，就像一片羽毛，落在了这里

    她躺在祭坛中间，灰白的长发柔顺地散开，眼静闭着，呼吸均匀而安静

    不远处，一个身影拖着被夕阳拉长的影子，一点点走了过来

    那是一个须发皆白的老者，穿着拖沓的黑色巫师袍，左眼的单片眼镜下是一颗浑浊、苍老的眼眸，而右眼的眼睛里却闪动着一颗墨绿的瞳孔

    他佝偻着，拄着一根漆黑但笔直拐杖，来到了少女身旁

    他轻轻伸出了苍老的手

    当树皮般的皮肤触及到少女的额头时，少女的呼吸变得紧张起来，均匀的节奏被打乱，少女的眉微蹙

    不知何时，那身穿巫师袍的老者已经不见了，只留下呼吸越发急乱的少女

    第一章：风琴

    我···这是在哪里？

    一道念头闪过，零便感觉一阵窒息感压上心头

    仿佛坠入深水中，呼吸都尤为困难

    零不断地挣扎，忽然，一口气猛地灌入她的嘴中，零睁开了眼，猛然坐起

    零身穿白衣，坐在藤蔓覆盖的祭坛上喘着粗气，环顾四周

    破损的白色大理石柱被藤蔓缠绕着，任由影子被夕阳拖得很长很长

    零大口的呼吸着，脑中一片混乱

    零大抵是失忆了，无论怎么想，都只想的起她自己的名字————零

    夕阳越垂越低，零渐渐恢复了均匀的呼吸，一阵不安感涌上心头
    
    天，要黑了

    
    至于她叫什么名字，这里究竟是哪儿，她并不想深究，因为她看到了一些有趣的东西......
