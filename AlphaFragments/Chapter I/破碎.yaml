Title: 破碎
Content: |
    破碎

    凉风拂过少女的身子，她曾经所见到的一切已然被��吞噬殆尽，都褪去了原有的色彩，秋天，让人不由得感到生命终结时的痛苦。
    
    （后续）天空上挂着一个黑洞，它周围的一切陆续穿过事件视界，速度越来越慢，没有什么东西能看到它掉进奇点的那一刻。

    （后续）肉眼可见的小行星从天空划过，她知道，给她的时间不多了。

    （后续）这星球（给这颗行星取个名字？）与恒星的距离与欧希极限相差不远了（小于洛希极限时，较小天体变为较大天体的环），她与（新朋友）一起逃离这儿，

    （后续）亲眼看见行星被撕碎的样子，到塔的第二层，取个名字，冬季（实际上是去到另外一个行星）

    在此，打败类似于很多异想之物的东西。

    再建立一个分支，为另一个主角，之后在此汇合，打得不相上下，同意一同探险。
    
