Title: 二叉搜索树
Content: |
    「好想养一只爱整理的二叉搜索树啊。」

    「它有一种天生的秩序感，」

    「所有比它小的都放左边，比它大的都放右边，整整齐齐的。」

    「你给它一个新数字，它会从根节点开始比大小，往左走还是往右走从不犹豫，最后找个空位置安顿下来。」

    「最可爱的是你让它输出所有数字，它会乖乖地先走左边，再报自己，最后走右边，出来的序列永远是升序的，比打印机还准。」

    「不过它有点小脾气——要是你按升序给它塞数字，它就变成一根细细的竹竿，歪歪扭扭地站着，委屈巴巴地跟你说“这样好累”。」

    「所以最好时不时给它做做旋转，让它重新平衡起来，胖乎乎的才健康。」